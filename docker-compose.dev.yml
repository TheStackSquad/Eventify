#Eventify/docker-compose.dev.yml
# =============================================================================
# Eventify — Development Docker Compose
# Usage: docker compose -f docker-compose.dev.yml up
# Hot reload: backend via Air, frontend via Next.js dev server
# =============================================================================

services:

  postgres:
    image: postgres:15-alpine
    container_name: eventify-postgres-dev
    environment:
      POSTGRES_USER:     ${DB_USER:-astronautdesh}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_NAME:-Eventify}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - eventify-dev-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-astronautdesh} -d ${DB_NAME:-Eventify}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - eventify-dev-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: eventify-backend-dev
    environment:
      PORT:               ${BACKEND_PORT:-8081}
      POSTGRES_URI:       postgres://${DB_USER:-astronautdesh}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-Eventify}?sslmode=disable
      GIN_MODE:           debug
      JWT_ACCESS_SECRET:  ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      FRONTEND_URL:       ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    volumes:
      - ./backend:/app          # mount source for hot reload
      - /app/tmp                # exclude Air's build output dir
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eventify-dev-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: eventify-frontend-dev
    environment:
      NEXT_PUBLIC_API_URL:   ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
      NEXT_PUBLIC_SITE_URL:  ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXTAUTH_URL:          ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET:       ${NEXTAUTH_SECRET}
      JWT_ACCESS_SECRET:     ${JWT_ACCESS_SECRET}
      JWT_PUBLIC_KEY:        ${JWT_PUBLIC_KEY}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app         # mount source for hot reload
      - /app/node_modules       # exclude node_modules from host mount
      - /app/.next              # exclude Next.js build cache
    depends_on:
      - backend
    networks:
      - eventify-dev-network

volumes:
  eventify-dev-data:
    name: eventify-dev-data

networks:
  eventify-dev-network:
    name: eventify-dev-network
    driver: bridge