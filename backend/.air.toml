# .air.toml — Air hot reload config for the Go backend
# https://github.com/air-verse/air

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ."
  bin = "./tmp/main"
  delay = 1000              # ms to wait before rebuilding after a change
  exclude_dir = ["tmp", "vendor", "testdata", "testy", "test_scripts"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_regex = ["_test\\.go"]
  kill_delay = "0s"
  log = "build-errors.log"
  stop_on_error = true

[log]
  time = true

[color]
  main     = "magenta"
  watcher  = "cyan"
  build    = "yellow"
  runner   = "green"

[misc]
  clean_on_exit = true